<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .body { fill: #d4a574; }
    .ring { fill: none; stroke: #d4a574; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .body { fill: #f5e6d3; }
      .ring { stroke: #f5e6d3; }
    }
  </style>
  <!-- Back arc of ring (top half, behind planet) -->
  <g transform="rotate(-22 32 32)">
    <path class="ring" d="M 6 32 A 26 8 0 0 0 58 32" />
  </g>
  <!-- Planet body -->
  <circle class="body" cx="32" cy="32" r="14" />
  <!-- Front arc of ring (bottom half, in front of planet) -->
  <g transform="rotate(-22 32 32)">
    <path class="ring" d="M 6 32 A 26 8 0 0 1 58 32" />
  </g>
</svg>
